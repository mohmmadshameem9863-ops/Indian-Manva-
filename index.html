<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Bangla Manga Reader</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <h1>Indian Bangla</h1>
        <p>Read Manga Online</p>
    </header>

    <!-- Search -->
    <section>
        <input type="text" placeholder="Search Manga...">
    </section>

    <!-- Manga List -->
    <main>
        <div class="manga-card">
            <img src="images/manga1.jpg" alt="Manga Cover">
            <h2>My First Manga</h2>
            <p>Chapter 1</p>
            <button>Read Now</button>
        </div>
    </main>

    <script src="script.js"></script>

</body>
</html>
